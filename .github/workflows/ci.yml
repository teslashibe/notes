name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Go ${{ matrix.go }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            go: "1.23.x"
          - os: ubuntu-latest
            go: "1.26.5"
          - os: macos-latest
            go: "1.26.5"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go }}
          check-latest: true
          cache: false
      - name: Check module files
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test
        env:
          NOTES_LIVE_READONLY: "0"
        run: go test ./...
      - name: Race test
        env:
          NOTES_LIVE_READONLY: "0"
        run: go test -race ./...
      - name: Compile unsigned native helper
        if: runner.os == 'macOS'
        run: ./scripts/build-native-helper "$RUNNER_TEMP/notes-native-helper"
      - name: Install pinned govulncheck
        if: matrix.go == '1.26.5' && runner.os == 'Linux'
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
      - name: Vulnerability scan
        if: matrix.go == '1.26.5' && runner.os == 'Linux'
        run: govulncheck ./...
